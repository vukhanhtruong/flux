[project]
name = "flux-bot"
version = "0.2.0"
description = "flux Agent Bot — Orchestrator with Claude Agent SDK"
requires-python = ">=3.12"
dependencies = [
    "flux-core",
    "flux-mcp",
    "python-telegram-bot[job-queue]>=21.0",
    "telegramify-markdown>=0.5.4",
    "deepagents>=0.1",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "rich>=13.7",
    "cryptography>=43",
]

[project.scripts]
flux = "flux_bot.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
omit = ["src/flux_bot/main.py", "src/flux_bot/cli/main.py"]

[tool.ruff]
line-length = 100
